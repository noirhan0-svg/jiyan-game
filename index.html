<div class="modalbg" id="modal"><div class="modal"><h2>🔗 設定外部角色檔案</h2><p>這是創作者設定。貼上角色檔案網址後，通關按鈕就能打開該連結。網址只存在這個頁面當次開啟期間；要發布給大家玩，發布前請把正式網址寫進 <code>FILE_URL</code>。</p><input id="url" type="url" placeholder="https://example.com/你的角色檔案" aria-label="外部角色檔案網址"><div class="actions"><button class="smallbtn" id="cancel">取消</button><button class="action" id="save">套用網址</button></div></div></div>
<script>

let pos={x:156,y:245};let t=0;

function text(s,x,y,color='#634f4a',size=9){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.fillText(s,x,y)}
function drawRoom(){rect(0,0,320,352,'#d9b58c');rect(0,0,320,62,'#e8cca9');rect(0,59,320,7,'#a48063');for(let y=66;y<352;y+=25){rect(0,y,320,1,'#c89c76');for(let x=(y%50===16?0:25);x<320;x+=51)rect(x,y,1,25,'#ba916c')}
 // window
 rect(119,10,92,47,'#a78072');rect(125,13,80,40,'#add1c9');rect(164,13,3,40,'#e9e3cb');rect(125,31,80,3,'#e9e3cb');rect(119,53,92,5,'#fff3d3');
 // rug
 rect(88,170,130,128,'#b58d7d');rect(93,175,120,118,'#e1b4a2');rect(101,182,104,104,'#efcfc1');

 // plant
 rect(25,230,33,13,'#916c5a');rect(30,211,23,24,'#658b73');rect(38,201,9,26,'#82a68c');rect(21,218,18,9,'#7c9c75');
 // desk note

 // clickable subtle indicators
 for(const o of rooms){if(o.id==='jiyan')continue; if(!completed.has(o.id)){rect(o.x+o.w-10,o.y+4,7,7,'#fff4cb');rect(o.x+o.w-8,o.y+2,3,11,'#fff4cb')}}
}
function drawSprite(x,y,expr){ // original 48x48 pixel sprite, positioned by foot at x,y
 const px=Math.round(x-24),py=Math.round(y-48)+(Math.sin(t/520)*0.8|0);ctx.save();ctx.translate(px,py);
 const R=(x,y,w,h,c)=>rect(x,y,w,h,c);
 R(12,43,11,3,'#84665b');R(27,43,11,3,'#84665b'); // feet
 R(12,33,24,11,'#343b44');R(11,22,26,15,'#34343b');R(20,25,8,13,'#fff2e0');R(22,25,3,11,'#a67c80');R(8,28,5,9,'#34343b');R(35,28,5,9,'#34343b');
 R(8,10,32,20,'#b88449');R(11,6,27,20,'#e3bd77');R(6,13,7,13,'#d9ae6c');R(35,12,7,13,'#dbac63');R(9,19,31,12,'#f4ceb0');R(11,6,8,6,'#efd196');R(17,4,9,6,'#e8c27b');R(25,6,11,8,'#f3d292');R(36,9,5,9,'#e6bd75');R(15,10,7,6,'#f1d295');R(23,9,9,7,'#d7ad69');
 R(12,22,4,3,'#c78d83');R(33,22,4,3,'#c78d83');
 if(expr==='happy'){R(16,20,6,2,'#704a47');R(28,20,6,2,'#704a47');R(23,26,5,2,'#ad646b')}else if(expr==='shy'){R(16,20,5,4,'#9b6a45');R(28,20,5,4,'#9b6a45');R(12,25,6,3,'#de8b92');R(32,25,6,3,'#de8b92');R(24,27,4,1,'#a66062')}else if(expr==='angry'){R(16,19,5,2,'#7d4942');R(28,19,5,2,'#7d4942');R(24,27,4,2,'#a66062')}else{R(17,19,5,5,'#a67b40');R(28,19,5,5,'#a67b40');R(19,20,2,2,'#f5e8ce');R(30,20,2,2,'#f5e8ce');R(24,27,4,1,'#a66062')}
 ctx.restore();
 if(active&&!moving){let symbol=expr==='angry'?'!':expr==='shy'?'♥':'♪';text(symbol,x+15,y-51,'#a86678',16)}
}
function render(){if(!$('sceneFallback').classList.contains('hidden'))$('sceneFallback').classList.add('hidden');t=performance.now();drawRoom(); if(moving){const p=Math.min((t-moving.start)/640,1),q=1-(1-p)*(1-p);pos.x=moving.fromX+(moving.toX-moving.fromX)*q;pos.y=moving.fromY+(moving.toY-moving.fromY)*q;if(p>=1){const f=moving.done;moving=null;f()}}drawSprite(pos.x,pos.y,expression);requestAnimationFrame(render)}
function dialogueUI(speaker,line,buttons){$('speaker').textContent=speaker;$('line').textContent=line;$('actions').replaceChildren();for(const b of buttons){let el=document.createElement('button');el.className=b.choice?'choice':'action';el.textContent=b.text;el.onclick=b.fn;$('actions').appendChild(el)}}
function say(lines,onEnd){dialogue=lines;idx=0;mode='dialog';const next=()=>{if(idx>=dialogue.length){mode='idle';expression='normal';active=null;if(onEnd)onEnd();else setIdle();return}const item=dialogue[idx++];if(typeof item==='string')dialogueUI('季宴',item,[{text:idx<dialogue.length?'繼續 ▸':'完成 ✓',fn:next}]);else {dialogueUI('季宴',item.prompt,item.options.map(o=>({text:o.label,choice:true,fn:()=>{expression=o.expr||'shy';say(o.lines,()=>{mode='idle';if(onEnd)onEnd();else setIdle()})}})))}};next()}
function setIdle(){if(ending)return;const remain=['books','sofa','silver','fridge'].filter(id=>!completed.has(id));if(remain.length){dialogueUI('提示',`還有 ${remain.length} 個物品可以探索。點擊畫面中的家具吧！`,[])}else{dialogueUI('提示','似乎還可以找季宴聊聊天……點點他吧。',[])} }
function updateScore(){score=Math.min(10,score);$('score').textContent=score+' / 10';$('fill').style.width=(score*10)+'%'}
function scene(id){if(mode!=='idle'||ending)return;const o=rooms.find(a=>a.id===id);if(id==='jiyan' && ['books','sofa','silver','fridge'].some(x=>!completed.has(x))){active='jiyan';expression='happy';say(['「嘿，先隨便看看吧。」「家裡沒什麼特別的東西就是了。」']);return}if(id!=='jiyan'&&completed.has(id)){active=id;expression='happy';say(['「這個剛剛不是看過了嗎？呵呵，還想再看一次呀？」']);return}mode='moving';active=id;expression='normal';$('hint').textContent='🐾 季宴正在走過去……';dialogueUI('季宴','「等我一下喔。」',[]);const done=()=>{expression={books:'happy',sofa:'shy',silver:'happy',fridge:'angry',jiyan:'shy'}[id];$('hint').textContent='👆 點家具探索，觸發季宴的小故事';const reward=()=>{if(!completed.has(id)){completed.add(id);score+=o.points;updateScore()}if(score>=10)finale();else setIdle()};if(id==='jiyan')say(['「說起來……今天你來找我，是有什麼事情嗎？」',{prompt:'「嗯？怎麼不說話？」',options:[{label:'「沒有，只是來看看你。」',expr:'shy',lines:['「……只是來看我？」','「這樣啊。呵呵，有點不習慣呢。」']},{label:'「想跟你一起待一會兒。」',expr:'shy',lines:['「跟我一起？」','「今天的客人還真奇怪。」「……不過，我也不討厭。」']}]}],reward);
 else {const lines={books:['「你也喜歡看小說？」','「這一整套，我可是一本一本慢慢收齊的。」','「要借你也可以，不過記得還我喔。」'],sofa:['「呼……果然還是家裡舒服。」','「平常工作完，最喜歡像這樣窩著。」','「……你要不要也坐一下？」'],silver:['「這些都是我慢慢收集的。」','「有些其實也沒多貴，就是覺得很漂亮。」','「你喜歡哪一個？」'],fridge:['「要吃點什麼嗎？我看看……」','「……等一下。」','「這個東西為什麼會出現在我家？！」']}[id];say(lines,reward)}};moving={start:performance.now(),fromX:pos.x,fromY:pos.y,toX:o.tx,toY:o.ty,done}}

function showEnd(){mode='end';$('speaker').textContent='♥ 好感度 10 / 10';$('line').innerHTML='';const wrap=document.createElement('div');wrap.className='end';wrap.innerHTML='<div class="heart">💌</div><h2>季宴的角色檔案已解鎖！</h2><p>今天的休息日，謝謝你陪他一起度過。</p>';const link=safeUrl(externalUrl);if(link){const a=document.createElement('a');a.textContent='前往角色檔案 ↗';a.href=link;a.target='_blank';a.rel='noopener noreferrer';wrap.append(a)}else{const p=document.createElement('p');p.className='lock';p.textContent='創作者尚未設定外部檔案網址';wrap.append(p);const b=document.createElement('button');b.className='smallbtn';b.textContent='設定解鎖連結';b.onclick=()=>{$('modal').classList.add('show');$('url').value=externalUrl};wrap.append(b)}const replay=document.createElement('button');replay.className='secondary';replay.textContent='再玩一次 ↻';replay.onclick=restart;wrap.append(replay);$('line').append(wrap);$('actions').replaceChildren();$('hint').textContent='🎉 完成！季宴很開心今天有你陪他'}
function restart(){score=0;completed.clear();mode='idle';ending=false;active=null;moving=null;expression='normal';pos={x:156,y:245};updateScore();$('hint').textContent='👆 點點家具，季宴就會走過去看看';setIdle()}
canvas.addEventListener('click',e=>{if(mode!=='idle')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*320/r.width,y=(e.clientY-r.top)*352/r.height;const char={id:'jiyan',x:pos.x-25,y:pos.y-50,w:50,h:54};if(x>=char.x&&x<=char.x+char.w&&y>=char.y&&y<=char.y+char.h){scene('jiyan');return}for(let i=rooms.length-2;i>=0;i--){let o=rooms[i];if(x>=o.x-9&&x<=o.x+o.w+8&&y>=o.y-10&&y<=o.y+o.h+8){scene(o.id);return}}});
$('next').onclick=()=>{mode='idle';setIdle()};$('settings').onclick=()=>{$('url').value=externalUrl;$('modal').classList.add('show')};$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{const val=$('url').value.trim();if(val&&!safeUrl(val)){alert('請輸入有效的 http 或 https 網址');return}externalUrl=val;$('modal').classList.remove('show');if(ending&&mode==='end')showEnd()};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});
try {requestAnimationFrame(render);} catch(err) { console.error(err); }
</script></body></html>
