<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4dfc7">
<title>季宴今天不營業｜V0.6</title>
<style>
:root{--ink:#493d40;--muted:#826f72;--paper:#fff8ed;--peach:#ffd9cb;--rose:#bc7585;--line:#d5b9a3}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:linear-gradient(#ecd6c6,#fff1dd);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);display:flex;justify-content:center;padding:12px}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
.app{width:min(100%,460px);background:var(--paper);border:3px solid #816b6a;box-shadow:0 9px 0 #987d79,0 20px 40px #68505133;border-radius:20px;overflow:hidden;align-self:flex-start}
.top{padding:14px 16px 9px}.eyebrow{font-weight:800;letter-spacing:2px;font-size:10px;color:#a08178}.headline{display:flex;align-items:center;justify-content:space-between;gap:6px}.headline h1{font-size:21px;margin:2px 0 10px}.smallbtn{border:1.5px solid #bea599;border-radius:10px;background:#fff4e8;color:#6b5150;padding:7px 10px;font-size:12px;font-weight:700}.barline{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}.bar{background:#e5cfc0;border-radius:50px;height:13px;border:1.5px solid #bca195;overflow:hidden}.fill{height:100%;background:repeating-linear-gradient(90deg,#d47f92 0 15px,#e59b9f 15px 18px);width:0;transition:width .3s}
.gamebox{padding:12px 12px 0}.stage{position:relative;border:3px solid #70595c;border-radius:12px;overflow:hidden;background:#e9c6a2;box-shadow:inset 0 0 0 2px #ead6bc}.stage canvas{position:relative;z-index:1;width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:manipulation}
.hint{background:#f7e7d8;padding:9px 11px;font-size:12px;text-align:center;color:#806960;font-weight:650}.dialog{margin:12px;background:#fffaf4;border:2px solid #cba998;border-radius:13px;padding:12px;min-height:132px;box-shadow:0 3px 0 #ead2c2}.speaker{color:#a76079;font-weight:900;font-size:13px;margin-bottom:8px}.line{min-height:43px;line-height:1.65;font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.action{flex:1;background:#d18a94;color:white;border:0;border-radius:9px;padding:11px;font-size:13px;font-weight:800;box-shadow:0 3px 0 #a55e6f}.action:active{transform:translateY(2px);box-shadow:0 1px 0 #a55e6f}.choice{width:100%;background:#f9e6df;border:1.5px solid #d39e9d;color:#69484d;padding:10px;border-radius:9px;text-align:left;font-size:13px;font-weight:750}.choice+.choice{margin-top:7px}.notice{font-size:12px;color:#876c6c;text-align:center;padding:0 20px 16px}
.modalbg{position:fixed;inset:0;background:#31292b9c;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modalbg.show{display:flex}.modal{width:min(100%,430px);background:#fff8ef;padding:22px;border:3px solid #907472;border-radius:18px;box-shadow:0 10px 0 #43353955}.modal h2{margin:0 0 10px;font-size:21px}.modal p{font-size:14px;line-height:1.6}.modal input{width:100%;border:1.5px solid #b69b91;border-radius:8px;padding:12px;margin:6px 0 15px;background:white;color:#413235}.modal .actions{justify-content:flex-end}.modal .action{flex:0 0 auto}.lock{display:inline-block;background:#f5e3da;color:#93677b;border-radius:8px;padding:5px 8px;font-size:11px}.end{text-align:center}.end .heart{font-size:38px}.end h2{margin:5px 0 9px}.end a{display:block;text-decoration:none;background:#c37e8b;color:white;padding:13px;border-radius:10px;font-weight:900;margin:14px 0 9px}.end .secondary{border:1px solid #bea599;border-radius:9px;background:#fff3e8;color:#6b5150;padding:9px 15px}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="eyebrow">PIXEL FRIENDS · V0.6</div>
    <div class="headline"><h1>季宴今天不營業 ☕</h1><button class="smallbtn" id="settings">⚙ 設定連結</button></div>
    <div class="barline"><span>♥ 好感度</span><span id="score">0 / 10</span></div>
    <div class="bar"><div id="fill" class="fill"></div></div>
  </div>
  <section class="gamebox">
    <div class="stage"><canvas id="world" width="320" height="352" aria-label="季宴的像素風小房間。可點擊書架、沙發、冰箱、銀飾盒與季宴本人。"></canvas></div>
    <div class="hint" id="hint">👆 點點家具，季宴就會走過去看看</div>
  </section>
  <div class="dialog" id="dialog">
    <div class="speaker" id="speaker">季宴</div>
    <div class="line" id="line">「嗯……？今天沒有上班喔。既然來了，要不要坐一下？」</div>
    <div class="actions" id="actions"><button class="action" id="next">開始逛逛 →</button></div>
  </div>
  <div class="notice">V0.6 已整合像素季宴角色 · 首次完成互動才增加好感度 · 無需存檔。</div>
</main>
<div class="modalbg" id="modal"><div class="modal"><h2>🔗 設定外部角色檔案</h2><p>貼上角色檔案網址後，通關按鈕就能打開該連結。網址只存在本次開啟期間。若要正式發布，請把網址寫進程式的 <code>FILE_URL</code>。</p><input id="url" type="url" placeholder="https://example.com/你的角色檔案" aria-label="外部角色檔案網址"><div class="actions"><button class="smallbtn" id="cancel">取消</button><button class="action" id="save">套用網址</button></div></div></div>
<script>
'use strict';
const FILE_URL='';
let externalUrl=FILE_URL;
const $=id=>document.getElementById(id), canvas=$('world'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const rooms=[
 {id:'books',name:'書架',x:20,y:37,w:74,h:92,tx:97,ty:161,points:2},
 {id:'sofa',name:'沙發',x:109,y:77,w:109,h:61,tx:164,ty:179,points:2},
 {id:'silver',name:'銀飾盒',x:246,y:61,w:59,h:75,tx:230,ty:169,points:2},
 {id:'fridge',name:'冰箱',x:247,y:193,w:59,h:84,tx:215,ty:292,points:1},
 {id:'jiyan',name:'季宴',x:112,y:181,w:98,h:123,tx:162,ty:233,points:3}
];
let score=0, completed=new Set(), mode='intro', dialogue=[], idx=0, ending=false, active=null, moving=null;
let pos={x:156,y:245}, currentFacing='down', expression='normal';
const spriteFiles={
  front_idle:'assets/front_idle.png', back_idle:'assets/back_idle.png', left_idle:'assets/left_idle.png', right_idle:'assets/right_idle.png',
  happy:'assets/happy.png', shy:'assets/shy.png', blink:'assets/blink.png',
  down1:'assets/down1.png', down2:'assets/down2.png', down3:'assets/down3.png',
  left1:'assets/left1.png', left2:'assets/left2.png', left3:'assets/left3.png',
  right1:'assets/right1.png', right2:'assets/right2.png', right3:'assets/right3.png',
  up1:'assets/up1.png', up2:'assets/up2.png', up3:'assets/up3.png'
};
const sprites={};
for(const [k,src] of Object.entries(spriteFiles)){
  const img=new Image(); img.src=src; sprites[k]=img;
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(s,x,y,color='#634f4a',size=9){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.fillText(s,x,y)}
function drawRoom(){
  rect(0,0,320,352,'#d9b58c'); rect(0,0,320,62,'#e8cca9'); rect(0,59,320,7,'#a48063');
  for(let y=66;y<352;y+=25){rect(0,y,320,1,'#c89c76'); for(let x=(y%50===16?0:25);x<320;x+=51)rect(x,y,1,25,'#ba916c')}
  rect(119,10,92,47,'#a78072'); rect(125,13,80,40,'#add1c9'); rect(164,13,3,40,'#e9e3cb'); rect(125,31,80,3,'#e9e3cb'); rect(119,53,92,5,'#fff3d3');
  rect(88,170,130,128,'#b58d7d'); rect(93,175,120,118,'#e1b4a2'); rect(101,182,104,104,'#efcfc1');
  rect(19,38,75,88,'#705242'); rect(24,43,65,77,'#9f7556'); for(let y of [67,93])rect(24,y,65,5,'#694c3f'); let colors=['#65897e','#ddaf82','#aa7484','#e1c68d','#8a7c8f']; for(let i=0;i<17;i++){let xx=27+(i%9)*7, yy=i<9?47:74; rect(xx,yy,5,18-(i%3)*2,colors[i%5])} rect(14,127,83,6,'#704e41');
  rect(113,84,101,53,'#8e7268'); rect(119,89,89,38,'#bd928a'); rect(119,92,89,16,'#cfaaa0'); rect(130,110,28,17,'#e4c1b1'); rect(168,110,30,17,'#debaa6'); rect(107,96,13,37,'#8c706d'); rect(208,96,13,37,'#8c706d');
  rect(122,185,76,38,'#845f4b'); rect(128,180,69,35,'#c39a78'); rect(142,189,16,8,'#e2d7bc'); rect(162,193,8,7,'#faf1da');
  rect(239,62,65,66,'#a07962'); rect(244,66,55,54,'#cca987'); rect(254,78,35,22,'#76565f'); rect(258,81,27,16,'#e3c0ba'); rect(268,86,8,6,'#ddd0d0'); rect(247,111,50,5,'#977661');
  rect(250,198,49,73,'#acbcb0'); rect(254,200,42,68,'#dfe7d7'); rect(254,224,42,3,'#98b3ab'); rect(259,210,3,12,'#9aada5'); rect(259,232,3,10,'#9aada5');
  rect(25,230,33,13,'#916c5a'); rect(30,211,23,24,'#658b73'); rect(38,201,9,26,'#82a68c'); rect(21,218,18,9,'#7c9c75');
  rect(25,300,68,23,'#9c7565'); rect(30,297,58,18,'#d4ab84'); rect(37,299,22,11,'#f7ead5');
  for(const o of rooms){ if(o.id==='jiyan') continue; if(!completed.has(o.id)){ rect(o.x+o.w-10,o.y+4,7,7,'#fff4cb'); rect(o.x+o.w-8,o.y+2,3,11,'#fff4cb'); } }
}
function getSpriteKey(){
  if(mode==='moving'){
    const n=Math.floor(performance.now()/145)%3+1;
    return currentFacing+n;
  }
  if(currentFacing==='down' && expression==='happy')return 'happy';
  if(currentFacing==='down' && expression==='shy')return 'shy';
  if(currentFacing==='down' && Math.floor(performance.now()/2600)%5===4)return 'blink';
  return {down:'front_idle',up:'back_idle',left:'left_idle',right:'right_idle'}[currentFacing]||'front_idle';
}
function drawFallbackSprite(){
  const px=Math.round(pos.x-24), py=Math.round(pos.y-48);
  rect(pos.x-12,pos.y-3,24,5,'rgba(102,70,65,.35)');
  rect(px+14,py+43,9,3,'#84665b'); rect(px+27,py+43,9,3,'#84665b');
  rect(px+12,py+33,24,11,'#343b44'); rect(px+11,py+22,26,15,'#34343b'); rect(px+20,py+25,8,13,'#fff2e0');
  rect(px+8,py+10,32,20,'#e3bd77'); rect(px+9,py+19,31,12,'#f4ceb0'); rect(px+17,py+19,5,5,'#a67b40'); rect(px+28,py+19,5,5,'#a67b40');
}
function drawSprite(){
  const key=getSpriteKey(), img=sprites[key];
  // Every sprite is an exact 48×48 frame with the same foot baseline.
  const drawX=Math.round(pos.x-32), drawY=Math.round(pos.y-64);
  ctx.fillStyle='rgba(110,78,74,0.28)';
  ctx.beginPath(); ctx.ellipse(pos.x,pos.y-3,14,4,0,0,Math.PI*2); ctx.fill();
  if(img && img.complete && img.naturalWidth){ctx.drawImage(img,drawX,drawY,64,64)}
  else drawFallbackSprite();
  if(active && mode!=='moving'){
    const symbol=expression==='angry'?'!':expression==='shy'?'♥':'♪';
    text(symbol,pos.x+16,pos.y-48,'#a86678',16);
  }
}
function render(){
  drawRoom();
  if(moving){
    const p=Math.min((performance.now()-moving.start)/640,1), q=1-(1-p)*(1-p);
    pos.x=moving.fromX+(moving.toX-moving.fromX)*q;
    pos.y=moving.fromY+(moving.toY-moving.fromY)*q;
    if(p>=1){ const f=moving.done; moving=null; f(); }
  }
  drawSprite();
  requestAnimationFrame(render);
}
function dialogueUI(speaker,line,buttons){ $('speaker').textContent=speaker; $('line').textContent=line; $('actions').replaceChildren(); for(const b of buttons){ const el=document.createElement('button'); el.className=b.choice?'choice':'action'; el.textContent=b.text; el.onclick=b.fn; $('actions').appendChild(el); } }
function say(lines,onEnd){ dialogue=lines; idx=0; mode='dialog'; const next=()=>{ if(idx>=dialogue.length){ mode='idle'; expression='normal'; active=null; if(onEnd) onEnd(); else setIdle(); return; } const item=dialogue[idx++]; if(typeof item==='string'){ dialogueUI('季宴', item, [{text: idx<dialogue.length?'繼續 ▸':'完成 ✓', fn: next}]); }
  else { dialogueUI('季宴', item.prompt, item.options.map(o=>({text:o.label, choice:true, fn:()=>{ expression=o.expr||'shy'; say(o.lines, ()=>{ mode='idle'; if(onEnd) onEnd(); else setIdle(); }); }}))); } }; next(); }
function setIdle(){ if(ending) return; const remain=['books','sofa','silver','fridge'].filter(id=>!completed.has(id)); if(remain.length){ dialogueUI('提示', `還有 ${remain.length} 個物品可以探索。點擊畫面中的家具吧！`, []); } else { dialogueUI('提示','似乎還可以找季宴聊聊天……點點他吧。',[]);} }
function updateScore(){ score=Math.min(10,score); $('score').textContent=score+' / 10'; $('fill').style.width=(score*10)+'%'; }
function updateFacing(toX,toY){ const dx=toX-pos.x, dy=toY-pos.y; if(Math.abs(dx)>Math.abs(dy)) currentFacing = dx<0 ? 'left' : 'right'; else currentFacing = dy<0 ? 'up' : 'down'; }
function scene(id){
  if(mode!=='idle' || ending) return;
  const o=rooms.find(a=>a.id===id);
  if(id==='jiyan' && ['books','sofa','silver','fridge'].some(x=>!completed.has(x))){ active='jiyan'; expression='happy'; currentFacing='down'; say(['「嘿，先隨便看看吧。」「家裡沒什麼特別的東西就是了。」']); return; }
  if(id!=='jiyan' && completed.has(id)){ active=id; expression='happy'; currentFacing='down'; say(['「這個剛剛不是看過了嗎？呵呵，還想再看一次呀？」']); return; }
  mode='moving'; active=id; expression='normal'; updateFacing(o.tx,o.ty); $('hint').textContent='🐾 季宴正在走過去……'; dialogueUI('季宴','「等我一下喔。」',[]);
  const done=()=>{ expression={books:'happy',sofa:'shy',silver:'happy',fridge:'angry',jiyan:'shy'}[id]; $('hint').textContent='👆 點家具探索，觸發季宴的小故事'; const reward=()=>{ if(!completed.has(id)){ completed.add(id); score+=o.points; updateScore(); } if(score>=10) finale(); else setIdle(); };
    if(id==='jiyan') say(['「說起來……今天你來找我，是有什麼事情嗎？」',{prompt:'「嗯？怎麼不說話？」', options:[{label:'「沒有，只是來看看你。」', expr:'shy', lines:['「……只是來看我？」','「這樣啊。呵呵，有點不習慣呢。」']},{label:'「想跟你一起待一會兒。」', expr:'shy', lines:['「跟我一起？」','「今天的客人還真奇怪。」「……不過，我也不討厭。」']}]}], reward);
    else {
      const lines={ books:['「你也喜歡看小說？」','「這一整套，我可是一本一本慢慢收齊的。」','「要借你也可以，不過記得還我喔。」'],
                    sofa:['「呼……果然還是家裡舒服。」','「平常工作完，最喜歡像這樣窩著。」','「……你要不要也坐一下？」'],
                    silver:['「這些都是我慢慢收集的。」','「有些其實也沒多貴，就是覺得很漂亮。」','「你喜歡哪一個？」'],
                    fridge:['「要吃點什麼嗎？我看看……」','「……等一下。」','「這個東西為什麼會出現在我家？！」'] }[id];
      say(lines, reward);
    }
  };
  moving={start:performance.now(), fromX:pos.x, fromY:pos.y, toX:o.tx, toY:o.ty, done};
}
function finale(){ ending=true; mode='end'; active='jiyan'; expression='shy'; currentFacing='down'; say(['「今天謝謝你陪我。」','「明明沒有什麼特別的事情……」','「但我好像過得很開心。」','「如果以後還想見面的話……」','「這個，給你。」'], ()=>showEnd()); }
function safeUrl(url){ try{ const u=new URL(url); return u.protocol==='https:'||u.protocol==='http:' ? u.href : null; } catch { return null; } }
function showEnd(){ mode='end'; $('speaker').textContent='♥ 好感度 10 / 10'; $('line').innerHTML=''; const wrap=document.createElement('div'); wrap.className='end'; wrap.innerHTML='<div class="heart">💌</div><h2>季宴的角色檔案已解鎖！</h2><p>今天的休息日，謝謝你陪他一起度過。</p>'; const link=safeUrl(externalUrl); if(link){ const a=document.createElement('a'); a.textContent='前往角色檔案 ↗'; a.href=link; a.target='_blank'; a.rel='noopener noreferrer'; wrap.append(a); }
  else { const p=document.createElement('p'); p.className='lock'; p.textContent='創作者尚未設定外部檔案網址'; wrap.append(p); const b=document.createElement('button'); b.className='smallbtn'; b.textContent='設定解鎖連結'; b.onclick=()=>{ $('modal').classList.add('show'); $('url').value=externalUrl; }; wrap.append(b); }
  const replay=document.createElement('button'); replay.className='secondary'; replay.textContent='再玩一次 ↻'; replay.onclick=restart; wrap.append(replay); $('line').append(wrap); $('actions').replaceChildren(); $('hint').textContent='🎉 完成！季宴很開心今天有你陪他'; }
function restart(){ score=0; completed.clear(); mode='idle'; ending=false; active=null; moving=null; expression='normal'; pos={x:156,y:245}; currentFacing='down'; updateScore(); $('hint').textContent='👆 點點家具，季宴就會走過去看看'; setIdle(); }
canvas.addEventListener('click',e=>{ if(mode!=='idle') return; const r=canvas.getBoundingClientRect(), x=(e.clientX-r.left)*320/r.width, y=(e.clientY-r.top)*352/r.height; const char={id:'jiyan', x:pos.x-26, y:pos.y-62, w:52, h:66}; if(x>=char.x&&x<=char.x+char.w&&y>=char.y&&y<=char.y+char.h){ scene('jiyan'); return; } for(let i=rooms.length-2;i>=0;i--){ const o=rooms[i]; if(x>=o.x-9 && x<=o.x+o.w+8 && y>=o.y-10 && y<=o.y+o.h+8){ scene(o.id); return; } } });
$('next').onclick=()=>{ mode='idle'; setIdle(); };
$('settings').onclick=()=>{ $('url').value=externalUrl; $('modal').classList.add('show'); };
$('cancel').onclick=()=> $('modal').classList.remove('show');
$('save').onclick=()=>{ const val=$('url').value.trim(); if(val && !safeUrl(val)){ alert('請輸入有效的 http 或 https 網址'); return; } externalUrl=val; $('modal').classList.remove('show'); if(ending && mode==='end') showEnd(); };
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')) $('modal').classList.remove('show'); });
requestAnimationFrame(render);
</script>
</body>
</html>
